<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>TravelNova AI • Smart Travel Companion</title>

<!-- LEAFLET -->

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MAPLIBRE -->

<link
href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
rel="stylesheet"
/>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

<!-- STYLE -->

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<!-- =========================================
     TOP BAR
========================================= -->

<div id="topBar">

  <div class="logo">
    🌍 TravelNova AI
  </div>

  <div id="weather">
    🌦 Loading weather...
  </div>

</div>


<!-- =========================================
     MAP CONTAINER
========================================= -->

<div id="mapContainer">

  <div id="map"></div>

  <div id="maplibre"></div>

</div>

<!-- =========================================
     SEARCH SECTION
========================================= -->

<div id="searchWrapper">

  <div id="mainSearchBar">

    <div id="searchIcon">
      🔍
    </div>

    <input
    type="text"
    id="mainSearchInput"
    placeholder="Search destination or start navigation...">

  </div>

  <!-- DROPDOWN -->

  <div id="searchDropdown">

    <div id="searchContainer">

      <!-- START -->

      <div class="inputGroup">

        <label class="inputLabel">
          📍 Start Location
        </label>

        <input
        type="text"
        id="startInput"
        class="searchInput"
        placeholder="Fetching current location..."
        readonly>

      </div>

      <!-- DESTINATION -->

      <div class="inputGroup">

        <label class="inputLabel">
          🧭 Destination
        </label>

        <input
        type="text"
        id="destinationInput"
        class="searchInput"
        placeholder="Enter destination">

      </div>

      <!-- GO BUTTON -->

      <button id="goBtn">
        Navigate
      </button>

    </div>

    <!-- AUTOCOMPLETE -->

    <div
    id="suggestions"
    class="suggestionsBox"></div>

  </div>

</div>

<!-- =========================================
     ALERT PANEL
========================================= -->

<div id="smartTravelPanel">

  <div class="panelTitle">🚗 Smart Travel Alerts</div>

  <div class="panelItem">
    📍 Distance: <span id="distanceValue">-- km</span>
  </div>

  <div class="panelItem">
    ⏱ ETA: <span id="etaValue">-- mins</span>
  </div>

  <div class="panelItem">
    🌦 Weather: <span id="weatherValue">--</span>
  </div>

  <div class="panelItem">
    🚦 Traffic: <span id="trafficValue">--</span>
  </div>

</div>

<!-- =========================================
     ROBOT BUTTON
========================================= -->

<div id="robotBtn">
  🤖
</div>

<!-- =========================================
     CHATBOT
========================================= -->

<div id="chatbot">

  <div id="chatHeader">

    <span>
      🤖 Travel AI Assistant
    </span>

    <button id="closeChatBtn">
      ✕
    </button>

  </div>

  <div id="chatMessages">

    <div class="message bot">

      Hello 👋

      <br><br>

      Ask me about:
      <br>
      🌦 Weather
      <br>
      🚦 Traffic
      <br>
      🚨 PulseX 
      <br>
      🎨 Theme
      <br>
      🗺 Advanced map
      <br>
      ↩️ Share Live Location

    </div>

  </div>

  <div id="chatInputArea">

    <input
    type="text"
    id="chatInput"
    placeholder="Ask something...">

    <button id="sendBtn">
      Send
    </button>

  </div>

  <div id="commentSection">

    <div id="commentTitle">
      💬 Leave a Comment
    </div>

    <textarea
    id="commentInput"
    placeholder="Write your feedback..."></textarea>

    <button id="commentBtn">
      Submit Comment
    </button>

  </div>

</div>

<!-- =========================================
     BOTTOM PANEL
========================================= -->

<div id="bottomPanel">

  <!-- VOICE -->

  <button
  class="actionBtn voiceOrbBtn"
  id="voiceBtn">

    <div class="voiceOrb">

      <div class="orbRing ring1"></div>

      <div class="orbRing ring2"></div>

      <div class="orbCore"></div>

    </div>

    <span class="voicePopupText">
      Voice AI
    </span>

  </button>

  <!-- NEARBY -->

  <button
  class="actionBtn"
  id="nearbyBtn">

  📡 Share

</button>

  <!-- TRAFFIC -->

  <button
  class="actionBtn"
  id="trafficBtn">

    🚦 Traffic

  </button>

  <!-- WEATHER -->

  <button
  class="actionBtn"
  id="weatherBtn"
  onclick="showWeather()">

    🌦 Weather

  </button>

  <!-- SAFETY -->

  <button
  class="actionBtn"
  id="safetyBtn"
  onclick="openSafety()">

    🚨 PulseX

  </button>

</div>

<!-- APP JS -->

<script src="js/app.js"></script>

</body>
</html>
